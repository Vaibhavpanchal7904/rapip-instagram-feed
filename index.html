
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPIP Instagram Feed</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .instagram-container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 1000px;
            border: none;
        }

        @media (max-width: 600px) {
            iframe {
                height: 850px;
            }
        }
    </style>
</head>

<body>

    <h1>RAPIP Instagram Feed</h1>

    <div class="instagram-container">
        <iframe
            src="https://www.instagram.com/rapip__cvmu/embed/"
            title="RAPIP Instagram Feed"
            loading="lazy"
            allowtransparency="true">
        </iframe>
    </div>

</body>
</html>
