
name: Update Instagram Feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install instaloader requests

      - name: Fetch Instagram posts
        run: python scripts/update_instagram.py

      - name: Commit updated feed
        run: |
          git config user.name "Instagram Feed Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/instagram.json public/instagram/
          git diff --cached --quiet || git commit -m "Update Instagram feed"
          git push
